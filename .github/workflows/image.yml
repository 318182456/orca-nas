name: Orca image
on:
  push:
    branches: [main]
    paths: [Dockerfile, scripts/entrypoint.sh, scripts/agent.sh, .github/workflows/image.yml, upstream.env]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: orca-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(gh api repos/stablyai/orca/releases/latest --jq .tag_name)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p .cache
          gh release download "$version" --repo stablyai/orca --pattern orca-server-linux-x64.tar.gz --pattern orca-server-sha256sums.txt --dir .cache
          cd .cache
          grep '  orca-server-linux-x64.tar.gz$' orca-server-sha256sums.txt | sha256sum -c -
          sha=$(sha256sum orca-server-linux-x64.tar.gz | cut -d' ' -f1)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:stable
          build-args: |
            ORCA_VERSION=${{ steps.release.outputs.version }}
            ORCA_SHA256=${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
